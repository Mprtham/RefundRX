name: Keep Render Services Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    # Set the repository variables UI_HEALTH_URL (e.g. .../_stcore/health) and
    # API_HEALTH_URL (e.g. .../health). A step is skipped when its variable is empty.
    steps:
      - name: Ping UI health endpoint
        if: ${{ vars.UI_HEALTH_URL != '' }}
        run: curl -sf --max-time 90 "${{ vars.UI_HEALTH_URL }}"
      - name: Ping API health endpoint
        if: ${{ vars.API_HEALTH_URL != '' }}
        run: curl -sf --max-time 90 "${{ vars.API_HEALTH_URL }}"
