name: Keep Render UI Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    # Keep only the UI warm: two always-on services would exceed Render's free
    # monthly hours. The API wakes on first use behind the UI's spinner.
    # Set the repository variable UI_HEALTH_URL, e.g. https://refundrx-ui.onrender.com/_stcore/health
    if: ${{ vars.UI_HEALTH_URL != '' }}
    steps:
      - name: Ping UI health endpoint
        run: curl -sf --max-time 90 "${{ vars.UI_HEALTH_URL }}"
