name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: tests + evals (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
      RAG_BACKEND: keyword
      PLANNER_BACKEND: reference
      TEST_DATABASE_URL: ${{ matrix.backend == 'postgres' && 'postgresql://postgres:postgres@localhost:5432/postgres' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Synthetic data generator + validation
        run: python -m scripts.generate_synthetic_data
      - name: Tests and the ten-scenario eval suite
        run: python -m pytest -q --junitxml=junit.xml
      - name: Results table
        if: always()
        run: |
          python -m scripts.junit_to_markdown junit.xml > eval_results.md
          cat eval_results.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-${{ matrix.backend }}
          path: eval_results.md
