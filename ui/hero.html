<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Hero for the Streamlit UI, embedded by ui/streamlit_app.py with
     st.components.v1.html. CSS, markup and chain-strip JS are copied from
     site/index.html (branch landing-page); the dock, scroll-spy, reveal code
     and hero footer bar are left out. The button scrolls the parent page to
     the claim form instead of linking to another site. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,500;0,6..72,700;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F6F3; --surface:#FFFFFF; --ink:#1F2326; --ink-2:#4A4F52; --muted:#6B6964;
  --line:#E6E4DE; --line-2:#D9D6CE;
  --ok-bg:#EDF3EC; --ok-fg:#346538; --bad-bg:#FDEBEC; --bad-fg:#9F2F2D; --warn-bg:#FBF3DB; --warn-fg:#956400;
  --ease:cubic-bezier(.16,1,.3,1);
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:4px}

/* ---------- entrance motion ---------- */
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes drift{to{transform:translateX(-50%)}}
.rise{animation:rise .85s var(--ease) both;animation-delay:var(--d,0s)}

/* ---------- hero ---------- */
.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:110px 24px 130px;overflow:hidden}
.chain{position:absolute;left:0;right:0;bottom:96px;height:64px;overflow:hidden;z-index:0;pointer-events:none;
  -webkit-mask-image:linear-gradient(to right,transparent,#000 16%,#000 84%,transparent);mask-image:linear-gradient(to right,transparent,#000 16%,#000 84%,transparent);
  animation:fade 1.6s ease both;animation-delay:.9s}
.chain-track{display:flex;align-items:center;width:max-content;height:100%;animation:drift 90s linear infinite}
.blk{flex:none;width:132px;height:52px;border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:0 14px;text-align:left;font-family:var(--mono);color:#B9B6AE}
.blk span{font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.blk b{font-size:12px;font-weight:400;color:#A29F97}
.lnk{flex:none;width:44px;height:1px;background:var(--line)}
.hero-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
.brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:28px}
.brand-row{display:flex;align-items:center;gap:10px}
.brand-mark{width:24px;height:24px;fill:none;stroke:var(--ink);stroke-width:1.4;stroke-linecap:round}
.wordmark{font-size:15px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;padding-left:.28em}
.byline{font-size:10px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);padding-left:.3em}
h1.display{font-family:var(--serif);text-transform:uppercase;color:var(--ink)}
.display .l1{display:block;font-weight:300;font-size:clamp(2.6rem,9vw,7rem);line-height:1;letter-spacing:.02em}
.display .l2{display:block;font-weight:700;font-size:clamp(2.4rem,8.4vw,6.7rem);line-height:.98;letter-spacing:.01em}
.sub{margin-top:24px;max-width:540px;font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.5;color:var(--ink-2)}
.cta{display:inline-block;margin-top:38px;padding:20px 58px;border-radius:50%;border:1px solid rgba(31,35,38,.55);color:var(--ink);text-decoration:none;font-size:12px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;transition:background-color .2s ease,color .2s ease,transform .15s ease}
.cta:hover{background:var(--ink);color:#fff}
.cta:active{transform:scale(.97)}
.cta-note{margin-top:18px;font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.02em;max-width:34ch}

@media (max-width:760px){
  .chain{bottom:84px}
  .cta{padding:18px 44px}
}

/* ---------- embedded in Streamlit (720px frame, no hero footer bar) ---------- */
/* The landing page lifted the chain 96px to clear the footer bar; with the bar
   gone it sits near the bottom, and the hero padding fits the fixed frame. */
.hero{padding:64px 24px 104px}
.chain{bottom:24px}

/* ---------- reduced motion ---------- */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}</style>
</head>
<body>
<header class="hero" id="top">
  <div class="chain" aria-hidden="true"><div class="chain-track" id="chain-track"></div></div>

  <div class="hero-inner">
    <div class="brand rise" style="--d:.1s">
      <div class="brand-row">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="1.5" y="8" width="9" height="8" rx="2.2"/><rect x="13.5" y="8" width="9" height="8" rx="2.2"/><path d="M10.5 12h3"/></svg>
        <span class="wordmark">RefundRx</span>
      </div>
      <span class="byline">A project by Prathamesh Mishra</span>
    </div>

    <h1 class="display rise" style="--d:.24s"><span class="l1">Auditable</span><span class="l2">by design</span></h1>

    <p class="sub rise" style="--d:.42s">An AI agent that decides NHS prescription-charge refund claims, and a hash-chained record of exactly how it decided.</p>

    <a class="cta rise" style="--d:.58s" href="#claim-form" id="cta-run">Run the agent</a>
    <p class="cta-note rise" style="--d:.7s">Runs on a free host. The first load can take up to a minute to wake.</p>
  </div>

</header>

<script>
(function () {
  'use strict';

  /* ---------- hashing (Web Crypto, SHA-256) ---------- */
  var hasCrypto = !!(window.crypto && window.crypto.subtle);
  var enc = new TextEncoder();
  function sha256Hex(s) {
    return window.crypto.subtle.digest('SHA-256', enc.encode(s)).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) {
        return b.toString(16).padStart(2, '0');
      }).join('');
    });
  }
  function short(h) { return h.slice(0, 8); }

  /* ---------- hero: a drifting strip of real SHA-256 chain links ---------- */
  function fakeHex(i) { return ((i * 2654435761) >>> 0).toString(16).padStart(8, '0'); }
  function paintChain(cells) {
    var html = cells.map(function (c) {
      return '<div class="blk"><span>row ' + String(c.i).padStart(4, '0') + '</span><b>' + c.h + '</b></div><i class="lnk"></i>';
    }).join('');
    document.getElementById('chain-track').innerHTML = html + html;
  }
  function buildHeroChain() {
    var cells = [], i;
    if (!hasCrypto) {
      for (i = 1; i <= 12; i++) cells.push({ i: i, h: fakeHex(i) });
      paintChain(cells);
      return;
    }
    var chain = Promise.resolve('GENESIS');
    for (i = 1; i <= 12; i++) {
      (function (n) {
        chain = chain.then(function (prev) {
          return sha256Hex(prev + '|row ' + n).then(function (h) { cells.push({ i: n, h: short(h) }); return h; });
        });
      })(i);
    }
    chain.then(function () { paintChain(cells); });
  }

  buildHeroChain();

  /* ---------- button: scroll the Streamlit page to the claim form ---------- */
  document.getElementById('cta-run').addEventListener('click', function (e) {
    e.preventDefault();
    try {
      var target = window.parent.document.getElementById('claim-form');
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (err) {
      /* Parent not reachable from the iframe sandbox: stay put. */
    }
  });
})();
</script>
</body>
</html>
